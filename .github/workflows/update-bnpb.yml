name: Refresh BNPB karhutla snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_snapshot.py'
      - '.github/workflows/update-bnpb.yml'
  schedule:
    - cron: '25 3 * * *' # 10:25 WIB daily, if GitHub Actions is enabled
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official BNPB ArcGIS data
        run: python scripts/update_snapshot.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/karhutla.json
          git diff --cached --quiet || (git commit -m "data: refresh BNPB snapshot" && git push)
